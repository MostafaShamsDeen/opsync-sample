<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpSync Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cg fill='none' stroke='%23c8a96e' stroke-width='3.4' stroke-linecap='round'%3E%3Cpath d='M9.5 15.5a17 17 0 0 1 27-4'/%3E%3Crect x='11' y='19' width='26' height='24' rx='4'/%3E%3C/g%3E%3Cpath d='M38.6 3.6 39 13.6 29.6 10.4Z' fill='%23c8a96e'/%3E%3Crect x='25.5' y='31.5' width='9' height='8' rx='1.8' fill='%23c8a96e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#0b0b0b; --panel:#121212; --panel2:#700018; --line:#700015;
  --gold:#c8a96e; --gold-dim:#8a7449; --gold-ghost:#c8a96e1f;
  --text:#f5f2ec; --muted:#9a948a;
  --good:#7fb59b; --warn:#d6a45e; --crit:#d4685a;
  --good-bg:#7fb59b1c; --warn-bg:#d6a45e1c; --crit-bg:#d4685a1c;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 18% -10%, #17150f 0%, transparent 62%);
  background-attachment:fixed}
a{color:var(--gold);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1220px;margin:0 auto;padding:0 28px 72px}

header{display:flex;align-items:center;gap:15px;padding:26px 0 18px}
header img{height:38px;width:auto;opacity:.95}
/* The company mark and the product mark are two different things, so they get
   a rule between them rather than being run together into one logo. */
.sep{width:1px;height:32px;background:#2e2c28;flex:none}
.opmark{height:31px;width:31px;color:var(--gold);flex:none}
.brand h1{font-family:var(--serif);font-weight:500;font-size:27px;margin:0;letter-spacing:.3px}
.brand .eyebrow{font-size:10px;letter-spacing:2.6px;text-transform:uppercase;
  color:var(--gold-dim);margin:0 0 1px}
.spacer{flex:1}
.clock{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.clock b{display:block;color:var(--text);font-size:13px;font-weight:500;font-family:var(--sans)}
.rule{height:2px;margin-bottom:26px;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold-dim) 38%,transparent 100%)}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:26px}
.strip .s{background:var(--panel);padding:15px 18px}
.strip .s span{display:block;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
.strip .s b{font-family:var(--serif);font-size:26px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:1}
.strip .s.alert b{color:var(--crit)}
.strip .s.hold b{color:var(--gold)}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  overflow:hidden;display:flex;flex-direction:column}
.card .top{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.card h2{font-family:var(--serif);font-size:19px;font-weight:500;margin:0 0 2px}
.card .id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;
  font-size:10.5px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;margin-top:10px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.state.ok{background:var(--good-bg);color:var(--good)} .state.ok .dot{background:var(--good)}
.state.late{background:var(--warn-bg);color:var(--warn)} .state.late .dot{background:var(--warn)}
.state.stale,.state.never{background:var(--crit-bg);color:var(--crit)}
.state.stale .dot,.state.never .dot{background:var(--crit)}
.state.paused{background:var(--gold-ghost);color:var(--gold)} .state.paused .dot{background:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:var(--line)}
.grid div{background:var(--panel);padding:12px 18px}
.grid b{display:block;font-family:var(--serif);font-size:22px;font-weight:500;
  font-variant-numeric:tabular-nums;line-height:1.1}
.grid span{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.card .note{padding:11px 18px;font-size:12px;color:var(--gold);background:var(--gold-ghost);
  border-top:1px solid var(--line)}
.card .acts{padding:13px 18px;display:flex;gap:9px;flex-wrap:wrap;
  border-top:1px solid var(--line);margin-top:auto}
/* The card body opens the detail; the buttons keep their own jobs. A whole
   card that is one big button would make Pause a click away from Open. */
.card .open{cursor:pointer;transition:background .15s}
.card .open:hover{background:#16150f}
.card .open:hover h2{color:var(--gold)}
.card .more{font-size:11px;color:var(--gold-dim);padding:0 18px 12px}
.card .open:hover .more{color:var(--gold)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:12px;
  font-size:12.5px}
.bar .t{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{height:7px;background:#0d0d0c;border-radius:4px;overflow:hidden}
.bar .fillbar{height:100%;background:var(--gold);border-radius:4px}
.bar .v{text-align:right;font-family:var(--mono);font-size:11.5px}
.tabblock{border:1px solid var(--line);border-radius:9px;padding:15px 17px;margin-bottom:14px}
.tabblock h5{font-family:var(--serif);font-size:16px;font-weight:500;margin:0 0 3px}
.tabblock .sub{color:var(--muted);font-size:11.5px;margin:0 0 13px}

button{font-family:var(--sans);font-size:12.5px;font-weight:500;cursor:pointer;
  border-radius:7px;padding:8px 15px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);transition:.15s}
button:hover:not(:disabled){border-color:var(--gold-dim);color:var(--gold)}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{background:var(--gold);color:#12100b;border-color:var(--gold);font-weight:600}
button.primary:hover:not(:disabled){background:#d8bb80;color:#12100b}
button.danger{color:var(--crit);border-color:#3a2220}
button.danger:hover:not(:disabled){background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
button.link{background:none;border:none;padding:0;color:var(--gold);font-size:12px}
button.link:hover{text-decoration:underline}

section{margin-top:34px}
#addbar{margin-top:26px;display:flex;justify-content:flex-end}
section > h3{font-family:var(--serif);font-size:20px;font-weight:500;margin:0 0 3px}
section > .lede{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);font-weight:500;padding:11px 16px;border-bottom:1px solid var(--line);
  background:var(--panel2)}
td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#15140f}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
.tag{font-size:10px;padding:2px 8px;border-radius:999px;letter-spacing:.5px;
  text-transform:uppercase;white-space:nowrap}
.tag.ok{background:var(--good-bg);color:var(--good)}
.tag.bad{background:var(--crit-bg);color:var(--crit)}
.tag.dry{background:var(--gold-ghost);color:var(--gold)}
.muted{color:var(--muted)}

pre.log{margin:0;padding:15px 17px;font-family:var(--mono);font-size:11.5px;line-height:1.65;
  color:#cfc9bd;background:#0d0d0c;max-height:330px;overflow:auto;
  white-space:pre-wrap;word-break:break-word}
.jobhead{padding:13px 17px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px;background:var(--panel2)}
.running{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:12px}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--gold);animation:p 1.1s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}

.scrim{position:fixed;inset:0;background:#000000cc;display:none;align-items:center;
  justify-content:center;padding:26px;z-index:50}
.scrim.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  max-width:780px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 24px 70px #000000a6}
.modal .mh{padding:20px 24px 15px;border-bottom:1px solid var(--line)}
.modal h4{font-family:var(--serif);font-size:21px;font-weight:500;margin:0 0 3px}
.modal .mb{padding:20px 24px}
.modal .mf{padding:15px 24px;border-top:1px solid var(--line);display:flex;gap:10px;
  justify-content:flex-end;flex-wrap:wrap}
.warnbox{border-left:3px solid var(--crit);background:var(--crit-bg);padding:12px 15px;
  border-radius:0 7px 7px 0;margin-bottom:16px;font-size:12.5px}
.goldbox{border-left:3px solid var(--gold);background:var(--gold-ghost);padding:12px 15px;
  border-radius:0 7px 7px 0;margin-bottom:16px;font-size:12.5px}
label.f{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);margin:14px 0 6px}
input[type=text]{width:100%;background:#0d0d0c;border:1px solid var(--line);color:var(--text);
  border-radius:7px;padding:9px 12px;font-family:var(--sans);font-size:13px}
input[type=text]:focus{outline:none;border-color:var(--gold-dim)}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:11px;display:flex;gap:20px;flex-wrap:wrap}
@media(max-width:820px){.strip{grid-template-columns:1fr 1fr}.wrap{padding:0 16px 56px}}
</style></head><body>
<div class="wrap">
  <header>
    <img src="__LOGO__" alt="Acme Agency">
    <span class="sep"></span>
    <!-- The OpSync mark. A sheet, one cell filled, and a cycle over it: the
         three things the tool actually is. Drawn rather than loaded so it is
         crisp at any size and takes its colour from the page. -->
    <svg class="opmark" viewBox="0 0 48 48" role="img" aria-label="OpSync">
      <path d="M9.5 15.5a17 17 0 0 1 27-4" fill="none" stroke="currentColor"
            stroke-width="3" stroke-linecap="round"/>
      <path d="M38.6 3.6 39 13.6 29.6 10.4Z" fill="currentColor"/>
      <rect x="11" y="19" width="26" height="24" rx="4" fill="none"
            stroke="currentColor" stroke-width="3"/>
      <rect x="25.5" y="31.5" width="9" height="8" rx="1.8" fill="currentColor"/>
    </svg>
    <div class="brand">
      <p class="eyebrow">Acme Agency &middot; Operations</p>
      <h1>OpSync Console</h1>
    </div>
    <div class="spacer"></div>
    <div class="clock"><b id="clk">&mdash;</b><span id="refreshed">reading&hellip;</span></div>
  </header>
  <div class="rule"></div>
  <div id="app"></div>
  <section id="addbar">
    <button onclick="startOnboard()">Add a client&hellip;</button>
  </section>
  <footer>
    <span>Reachable only from this machine</span>
    <span>Refreshing every 20 seconds</span>
    <span id="dbsize"></span>
  </footer>
</div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<script>
var S = null, JOB = null, TIMER = null;

function h(s){ return String(s === null || s === undefined ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function n(v){ return (v === null || v === undefined) ? "0" : Number(v).toLocaleString(); }
function bytes(b){ if(!b) return ""; var u=["B","KB","MB","GB"],i=0,x=b;
  while(x>=1024 && i<u.length-1){x/=1024;i++;} return x.toFixed(x<10&&i>0?1:0)+" "+u[i]; }

function get(url){ return fetch(url,{headers:{"Accept":"application/json"}})
  .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
function post(url, body){ return fetch(url,{method:"POST",
  headers:{"Content-Type":"application/json","X-OpSync":"1"},
  body:JSON.stringify(body||{})}).then(function(r){ return r.json(); }); }

/* How many values the last run read and found already correct.
   This replaced a count of disagreements, which was accurate and read as a
   fault list to anybody who did not already know what it meant: 138 looks like
   138 problems, and they are job titles that have moved on since the row was
   typed. the developer is the only technical person at Acme Agency, so everybody else
   who opens this page reads that number without the context that makes it
   harmless. Agreement is the same measurement from the useful side, and it is
   also the evidence that the tool is reading the sheet correctly: something
   reading the wrong column would disagree with everything rather than agree
   with ten thousand things.

   The disagreement counts are no longer shown anywhere on this page, on his
   instruction. They are still recorded on every run, still printed in the run
   log, and still on the hidden _opsync panel in each client's own sheet. */
function checked(c){
  var s = c.summary;
  if(!s || !s.tabs) return 0;
  return s.tabs.reduce(function(a, t){ return a + (t.agree || 0); }, 0);
}

function stateLabel(c){
  if(c.paused) return {cls:"paused", txt:"Paused"};
  var s = c.state || "never";
  var txt = {ok:"Healthy", late:"Running late", stale:"Not running", never:"Never run"}[s] || s;
  return {cls:s, txt:txt};
}

function render(){
  if(!S) return;
  var cs = S.clients || [];
  var alerts = cs.filter(function(c){ return !c.paused && (c.state==="stale"||c.state==="never"); }).length;
  var held = cs.filter(function(c){ return !!c.paused; }).length;
  var writes = cs.reduce(function(a,c){ return a + (c.writes_total||0); }, 0);

  var out = '<div class="strip">' +
    '<div class="s"><span>Clients running</span><b>' + (cs.length - held - alerts) + ' of ' + cs.length + '</b></div>' +
    '<div class="s' + (alerts?" alert":"") + '"><span>Needing attention</span><b>' + alerts + '</b></div>' +
    '<div class="s' + (held?" hold":"") + '"><span>Paused</span><b>' + held + '</b></div>' +
    '<div class="s"><span>Cells written, all time</span><b>' + n(writes) + '</b></div>' +
    '</div><div class="cards">';

  cs.forEach(function(c){
    var st = stateLabel(c);
    out += '<div class="card">' +
      '<div class="open" onclick="openClient(\'' + h(c.id) + '\')"><div class="top">' +
      '<h2>' + h(c.name) + '</h2>' +
      '<div class="id">' + h(c.id) + ' &middot; ' + h((c.tabs||[]).length) + ' persona tabs</div>' +
      '<div class="state ' + st.cls + '"><i class="dot"></i>' + h(st.txt) + '</div>' +
      ' <span class="muted" style="font-size:11.5px">' + h(c.last_text || "") + '</span>' +
      '</div><div class="grid">' +
      '<div><b>' + n(c.writes_total) + '</b><span>Cells filled in</span></div>' +
      '<div><b>' + n(checked(c)) + '</b><span>Values checked</span></div>' +
      '<div><b>' + n(c.leads) + '</b><span>Leads tracked</span></div>' +
      '</div><div class="more">Open detail &rarr;</div></div>';
    if(c.paused){
      out += '<div class="note">Paused by ' + h(c.paused.by) + ' on ' + h((c.paused.at||"").replace("T"," ")) +
        (c.paused.reason ? '. ' + h(c.paused.reason) : '') +
        '<br><span class="muted">Runs skip this client. Sheet access is unchanged.</span></div>';
    }
    out += '<div class="acts">' +
      '<button class="primary" onclick="runNow(\'' + h(c.id) + '\')"' + (JOB && JOB.state==="running" ? " disabled" : "") + '>Run now</button>' +
      (c.paused
        ? '<button onclick="resume(\'' + h(c.id) + '\')">Resume</button>'
        : '<button onclick="askPause(\'' + h(c.id) + '\',\'' + h(c.name) + '\')">Pause</button>') +
      '<button onclick="showRuns(\'' + h(c.id) + '\')">Run history</button>' +
      '</div></div>';
  });
  out += '</div>';

  if(JOB){
    out += '<section><h3>Activity</h3>' +
      '<p class="lede">Output from the last command started here.</p>' +
      '<div class="panel"><div class="jobhead">' +
      (JOB.state === "running"
        ? '<span class="running"><i class="pulse"></i>' + h(JOB.label) + ' &mdash; running</span>'
        : '<span class="tag ' + (JOB.state==="done"?"ok":"bad") + '">' + h(JOB.state) + '</span> <span class="muted">' + h(JOB.label) + '</span>') +
      '<div class="spacer" style="flex:1"></div><span class="muted num">started ' + h(JOB.started) + '</span>' +
      '</div><pre class="log" id="log">' + h((JOB.lines||[]).join("\n")) + '</pre></div></section>';
  }

  document.getElementById("app").innerHTML = out;
  var log = document.getElementById("log");
  if(log && JOB && JOB.state === "running") log.scrollTop = log.scrollHeight;
  var total = cs.reduce(function(a,c){ return a + (c.db_bytes||0); }, 0);
  document.getElementById("dbsize").textContent = "Databases " + bytes(total);
  document.getElementById("clk").textContent = new Date().toLocaleTimeString();
  document.getElementById("refreshed").textContent = "last refreshed";
}

function tick(){
  return get("/api/state").then(function(d){ S = d; JOB = d.job; render(); })
    .catch(function(){ document.getElementById("refreshed").textContent = "console offline"; });
}

/* ---- actions ---- */
function runNow(id){
  post("/api/run", {client:id}).then(function(r){
    if(r.error){ alert(r.error); return; }
    fast();
  });
}
function askPause(id, name){
  openModal('<div class="mh"><h4>Pause ' + h(name) + '</h4>' +
    '<p class="muted" style="margin:0;font-size:12.5px">Runs will skip this client until it is resumed.</p></div>' +
    '<div class="mb"><div class="goldbox"><b>This is not the emergency stop.</b> It stops this machine ' +
    'running against the client. It does not remove the tool&rsquo;s access to the sheet. ' +
    'To revoke access, take the service account off the sheet&rsquo;s share list &mdash; that works ' +
    'whether or not this machine is awake, and anyone with edit rights can do it.</div>' +
    '<label class="f">Why (recorded, so the next person knows)</label>' +
    '<input type="text" id="why" placeholder="e.g. client asked us to hold while they tidy the sheet">' +
    '</div><div class="mf"><button onclick="closeModal()">Cancel</button>' +
    '<button class="primary" onclick="doPause(\'' + h(id) + '\')">Pause this client</button></div>');
}
function doPause(id){
  var why = (document.getElementById("why")||{}).value || "";
  post("/api/pause", {client:id, reason:why}).then(function(){ closeModal(); fast(); });
}
function resume(id){ post("/api/resume", {client:id}).then(function(){ fast(); }); }

/* The detail view: what the last run did, per tab, plus what this client has
   had written to it over time and which campaigns feed which tab. */
function openClient(id){
  var c = (S.clients || []).filter(function(x){ return x.id === id; })[0];
  if(!c) return;
  var sum = c.summary, body = "";

  if(sum && sum.tabs && sum.tabs.length){
    body += '<div class="tabblock"><h5>Each persona tab</h5>' +
      '<p class="sub">From the last run.</p><table><thead><tr><th>Tab</th>' +
      '<th>Values checked</th><th>Cells filled</th><th>Rows created</th></tr></thead><tbody>' +
      sum.tabs.map(function(t){
        return '<tr><td>' + h(t.tab) + '</td>' +
          '<td class="num">' + n(t.agree) + '</td>' +
          '<td class="num">' + n(t.fill) + '</td>' +
          '<td class="num">' + n(t.new_rows || 0) + '</td></tr>';
      }).join("") + '</tbody></table></div>';
  } else {
    body += '<p class="muted">No run has recorded a breakdown yet.</p>';
  }

  var wr = c.writes_by_reason || {};
  var rk = Object.keys(wr);
  body += '<div class="tabblock"><h5>What it has written, all time</h5>' +
    '<p class="sub">' + n(c.writes_total) + ' cells. Every one went into a cell that was ' +
    'empty or a row it created.</p>' +
    (rk.length ? '<div class="bars">' + rk.map(function(k){
      var top2 = Math.max.apply(null, rk.map(function(x){ return wr[x]; }));
      return '<div class="bar"><div class="t">' + h(k) + '</div>' +
        '<div class="track"><div class="fillbar" style="width:' +
        Math.max(4, Math.round(wr[k] / top2 * 100)) + '%"></div></div>' +
        '<div class="v">' + n(wr[k]) + '</div></div>';
    }).join("") + '</div>' : '<p class="muted" style="font-size:12px;margin:0">Nothing written yet.</p>') +
    '</div>';

  body += '<div class="tabblock"><h5>Campaigns feeding this sheet</h5>' +
    '<p class="sub">' + n((c.campaigns||[]).length) + ' campaigns across ' +
    n((c.tabs||[]).length) + ' persona tabs</p>' +
    '<table><thead><tr><th>Campaign</th><th>Goes to tab</th></tr></thead><tbody>' +
    (c.campaigns||[]).map(function(m){
      return '<tr><td>' + h(m.name) + '</td><td>' + h(m.persona_tab || "&mdash;") + '</td></tr>';
    }).join("") + '</tbody></table></div>';

  body += '<div class="tabblock"><h5>Today</h5><p class="sub">' +
    n(c.runs_today) + ' runs of an expected ' + n(c.expected_today) + ' &middot; ' +
    n(c.failures_today) + ' failed &middot; ' + n(c.cells_today) + ' cells written &middot; ' +
    n(c.watched) + ' dates obtained by watching rather than from a webhook</p></div>';

  openModal('<div class="mh"><h4>' + h(c.name) + '</h4>' +
    '<p class="muted" style="margin:0;font-size:12.5px">' + h(c.id) + ' &middot; ' +
    h(c.last_text || "") + '</p></div><div class="mb">' + body + '</div>' +
    '<div class="mf"><button onclick="showRuns(\'' + h(id) + '\')">Run history</button>' +
    '<button onclick="closeModal()">Close</button></div>');
}

function showRuns(id){
  get("/api/runs/" + encodeURIComponent(id)).then(function(d){
    var rows = d.runs.map(function(r){
      var tag = r.mode !== "write" ? '<span class="tag dry">dry run</span>'
        : (r.status === "ok" ? '<span class="tag ok">ok</span>'
           : '<span class="tag bad">' + h(r.status || "unfinished") + '</span>');
      var undo = (r.cells_written > 0)
        ? '<button class="link" onclick="askRollback(\'' + h(id) + '\',' + r.id + ')">Undo&hellip;</button>'
        : '<span class="muted">nothing written</span>';
      return '<tr><td class="num">' + r.id + '</td>' +
        '<td class="num">' + h((r.started_at||"").replace("T"," ")) + '</td>' +
        '<td>' + tag + '</td>' +
        '<td class="num">' + n(r.cells_written) + '</td>' +
        '<td>' + undo + '</td></tr>';
    }).join("");
    openModal('<div class="mh"><h4>Run history</h4>' +
      '<p class="muted" style="margin:0;font-size:12.5px">' + h(id) + ' &mdash; most recent first</p></div>' +
      '<div class="mb" style="padding:0"><table><thead><tr><th>Run</th><th>Started</th><th>Result</th>' +
      '<th>Cells</th><th></th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="mf"><button onclick="closeModal()">Close</button></div>');
  });
}

function askRollback(id, runId){
  get("/api/run/" + encodeURIComponent(id) + "/" + runId).then(function(d){
    var p = d.plan;
    var sample = d.sample.slice(0, 18).map(function(c){
      return '<tr><td>' + h(c.tab) + '</td><td class="num">' + h(c.row) + '</td>' +
        '<td>' + h(c.header) + '</td><td class="num">' + h(c.value) + '</td></tr>';
    }).join("");
    openModal('<div class="mh"><h4>Undo run ' + runId + '</h4>' +
      '<p class="muted" style="margin:0;font-size:12.5px">' + h(id) + ' &mdash; started ' +
      h((d.run.started_at||"").replace("T"," ")) + '</p></div><div class="mb">' +
      '<div class="warnbox"><b>This is the one thing here that removes data.</b> It clears ' +
      n(p.cells_to_clear) + ' cells this run filled, across ' + h(p.tabs.join(", ")) + '. ' +
      'Every one of them was empty before the run, so nothing a person typed is underneath. ' +
      'A cell someone has changed since is left exactly as it is, and you are told which.' +
      (p.rows_the_tool_created
        ? ' It created ' + n(p.rows_the_tool_created) + ' rows; those rows are emptied, not deleted, ' +
          'because deleting them would move every row below and somebody may have typed there since.'
        : '') +
      '</div>' +
      (sample ? '<p class="muted" style="font-size:12px;margin:0 0 8px">First ' +
        Math.min(18, d.sample.length) + ' of ' + n(p.cells_to_clear) + ' cells:</p>' +
        '<div class="panel"><table><thead><tr><th>Tab</th><th>Row</th><th>Column</th><th>Value now</th>' +
        '</tr></thead><tbody>' + sample + '</tbody></table></div>' : '') +
      '<label class="f">Type UNDO to confirm</label>' +
      '<input type="text" id="conf" autocomplete="off" placeholder="UNDO">' +
      '</div><div class="mf"><button onclick="closeModal()">Cancel</button>' +
      '<button class="danger" onclick="doRollback(\'' + h(id) + '\',' + runId + ')">Clear these cells</button></div>');
  });
}
function doRollback(id, runId){
  var c = (document.getElementById("conf")||{}).value || "";
  if(c.trim().toUpperCase() !== "UNDO"){ alert("Type UNDO to confirm."); return; }
  post("/api/rollback", {client:id, run:runId, confirm:c.trim().toUpperCase()})
    .then(function(r){
      if(r.error){ alert(r.error); return; }
      closeModal(); fast();
      var msg = "Cleared " + r.cleared + " of " + r.planned + " cells.";
      if(r.left_changed_by_person){
        msg += "

Left " + r.left_changed_by_person + " cell(s) alone because someone has changed them since this run wrote them:
" +
          (r.left_examples||[]).join("
");
      }
      if(r.left_other){ msg += "

" + r.left_other + " cell(s) were already empty or their column has moved."; }
      alert(msg);
    });
}

function openModal(html){
  document.getElementById("modal").innerHTML = html;
  document.getElementById("scrim").classList.add("on");
}
function closeModal(){ document.getElementById("scrim").classList.remove("on"); }
document.getElementById("scrim").addEventListener("click", function(e){
  if(e.target.id === "scrim") closeModal();
});
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

/* ---- adding a client ----
   A wizard rather than a form, because two of the settings cannot be inferred
   and one of them, campaign to persona tab, puts a client's data on the wrong
   tab if it is wrong. Every step measures and shows its evidence; the person
   confirms. Nothing is written until the last screen. */
var OB = null;

function startOnboard(){
  OB = {};
  openModal('<div class="mh"><h4>Add a client</h4>' +
    '<p class="muted" style="margin:0;font-size:12.5px">Step 1 of 3 &mdash; nothing is written yet</p></div>' +
    '<div class="mb">' +
    '<div class="goldbox">Share the client&rsquo;s operations sheet with ' +
    '<b>opsync@example-project.iam.gserviceaccount.com</b> as an Editor before you start, ' +
    'or the next step cannot read it.</div>' +
    '<label class="f">Client name, as it should read on this page</label>' +
    '<input type="text" id="ob_name" placeholder="Acme Brands - Jane Smith">' +
    '<label class="f">Short name (lower case, no spaces)</label>' +
    '<input type="text" id="ob_id" placeholder="acme-brands">' +
    '<label class="f">HeyReach API key for their workspace</label>' +
    '<input type="text" id="ob_key" placeholder="paste the key">' +
    '<label class="f">Link to their operations sheet</label>' +
    '<input type="text" id="ob_sheet" placeholder="https://docs.google.com/spreadsheets/d/...">' +
    '<p class="muted" style="font-size:12px;margin:16px 0 0">The next step reads the sheet and the ' +
    'workspace and proposes how the campaigns line up with the persona tabs. It writes nothing.</p>' +
    '</div><div class="mf"><button onclick="closeModal()">Cancel</button>' +
    '<button class="primary" onclick="obInspect()">Measure it</button></div>');
}

function obInspect(){
  var v = function(id){ return (document.getElementById(id)||{}).value || ""; };
  OB = {name: v("ob_name"), client_id: v("ob_id").trim().toLowerCase(),
        api_key: v("ob_key").trim(), sheet: v("ob_sheet").trim()};
  openModal('<div class="mh"><h4>Measuring</h4>' +
    '<p class="muted" style="margin:0;font-size:12.5px">Reading the sheet and sampling each campaign. ' +
    'This can take a minute.</p></div><div class="mb">' +
    '<span class="running"><i class="pulse"></i>working</span></div>');
  post("/api/onboard/inspect", OB).then(function(r){
    if(r.error){ obError(r.error); return; }
    OB.found = r;
    obStep2();
  }).catch(function(e){ obError(String(e)); });
}

function obError(msg){
  openModal('<div class="mh"><h4>Cannot continue</h4></div><div class="mb">' +
    '<div class="warnbox">' + h(msg) + '</div>' +
    '<p class="muted" style="font-size:12.5px;margin:0">Nothing has been written.</p>' +
    '</div><div class="mf"><button onclick="closeModal()">Close</button>' +
    '<button class="primary" onclick="startOnboard()">Back</button></div>');
}

function obStep2(){
  var f = OB.found;
  var rows = f.mapping.map(function(m, i){
    var opts = ['<option value="">&mdash; do not track &mdash;</option>'].concat(
      f.tabs.map(function(t){
        return '<option value="' + h(t) + '"' +
          (t === m.proposed ? " selected" : "") + '>' + h(t) + '</option>';
      })).join("");
    var conf = m.proposed
      ? '<span class="tag ' + (m.clear ? "ok" : "bad") + '">' + m.confidence + '% of its leads</span>'
      : '<span class="tag bad">no tab matches</span>';
    return '<tr><td>' + h(m.campaign) + '<div class="muted num">' + h(m.campaign_id) + '</div></td>' +
      '<td>' + conf + (m.runner_up ? '<div class="muted" style="font-size:11px">next best ' +
        h(m.runner_up) + ' at ' + m.runner_up_share + '%</div>' : '') + '</td>' +
      '<td><select id="map' + i + '" style="width:100%;background:#0d0d0c;color:var(--text);' +
      'border:1px solid var(--line);border-radius:6px;padding:7px">' + opts + '</select></td></tr>';
  }).join("");

  var weak = f.mapping.filter(function(m){ return !m.clear; }).length;
  openModal('<div class="mh"><h4>Check the mapping</h4>' +
    '<p class="muted" style="margin:0;font-size:12.5px">Step 2 of 3 &mdash; ' +
    h(f.sheet_title) + '</p></div><div class="mb">' +
    '<div class="goldbox"><b>This is the one thing I cannot decide for you.</b> Campaign names do not ' +
    'match tab names: on two of the three clients already running, "F&amp;B Executives" is ' +
    '"Execs in F&amp;B" and "Local Persona (Ohio)" is "Riverside, Ohio". The percentage is ' +
    'how many of that campaign&rsquo;s leads are already on that tab, which is evidence rather than a ' +
    'guess &mdash; but a wrong answer here puts a client&rsquo;s data on the wrong tab, so please read it.</div>' +
    (weak ? '<div class="warnbox"><b>' + weak + (weak === 1 ? ' needs' : ' need') + ' a closer look.</b> Either nothing matched ' +
      'well, or the best tab is not clearly ahead of the next.</div>' : '') +
    '<table><thead><tr><th>Campaign</th><th>Evidence</th><th style="width:38%">Persona tab</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table>' +
    '<div class="tabblock" style="margin-top:18px"><h5>What it read from the sheet</h5>' +
    '<p class="sub">Confirm these look right.</p>' +
    '<table><tbody>' +
    '<tr><td>Persona tabs found</td><td>' + h(f.tabs.join(", ")) + '</td></tr>' +
    '<tr><td>Header row / first data row</td><td class="num">' + f.header_row + ' / ' + f.first_data_row + '</td></tr>' +
    '<tr><td>Invite columns sit under</td><td class="num">' + h(f.band || "not found") + '</td></tr>' +
    '<tr><td>Date format</td><td class="num">' + (f.date_format
      ? h(f.date_format.spec) + (f.date_format.strip ? " (no leading zero)" : "") +
        ' &mdash; fits ' + n(f.date_format.matched) + ' of ' + n(f.date_format.of) + ' dates already there'
      : "could not fit one") + '</td></tr>' +
    '<tr><td>Senders seen</td><td class="num">' + h((f.senders||[]).join(", ") || "none") + '</td></tr>' +
    (f.skipped_tabs && f.skipped_tabs.length
      ? '<tr><td>Tabs skipped</td><td class="muted">' + h(f.skipped_tabs.join(", ")) +
        ' &mdash; no Full Name and LinkedIn URL columns</td></tr>' : "") +
    '</tbody></table></div>' +
    '</div><div class="mf"><button onclick="startOnboard()">Back</button>' +
    '<button class="primary" onclick="obStep3()">Looks right</button></div>');
}

function obStep3(){
  var f = OB.found;
  f.mapping.forEach(function(m, i){
    m.assigned = (document.getElementById("map" + i)||{}).value || "";
  });
  var assigned = f.mapping.filter(function(m){ return m.assigned; });
  if(!assigned.length){ alert("Assign at least one campaign to a tab."); return; }
  var byTab = {};
  assigned.forEach(function(m){ (byTab[m.assigned] = byTab[m.assigned] || []).push(m.campaign); });

  openModal('<div class="mh"><h4>Confirm</h4>' +
    '<p class="muted" style="margin:0;font-size:12.5px">Step 3 of 3 &mdash; this writes files</p></div>' +
    '<div class="mb">' +
    '<div class="tabblock"><h5>What will be saved</h5><table><tbody>' +
    Object.keys(byTab).sort().map(function(t){
      return '<tr><td>' + h(t) + '</td><td class="muted">' + h(byTab[t].join(", ")) + '</td></tr>';
    }).join("") + '</tbody></table></div>' +
    '<div class="goldbox"><b>It starts paused.</b> The client is added, the key is stored outside ' +
    'this folder, and a full copy of every tab is taken before anything is written. It will not ' +
    'touch the sheet until you resume it, so run it once from the card and read what it would do first.</div>' +
    '<label class="f">Type ADD to confirm</label>' +
    '<input type="text" id="ob_conf" autocomplete="off" placeholder="ADD">' +
    '</div><div class="mf"><button onclick="obStep2()">Back</button>' +
    '<button class="primary" onclick="obCommit()">Add this client</button></div>');
}

function obCommit(){
  var c = (document.getElementById("ob_conf")||{}).value || "";
  if(c.trim().toUpperCase() !== "ADD"){ alert("Type ADD to confirm."); return; }
  var f = OB.found;
  var payload = {
    client_id: f.client_id, name: OB.name, api_key: OB.api_key,
    sheet_id: f.sheet_id, header_row: f.header_row,
    first_data_row: f.first_data_row, band: f.band,
    date_format: f.date_format, senders: f.senders,
    tabs: f.tabs, mapping: f.mapping
  };
  openModal('<div class="mh"><h4>Adding</h4></div><div class="mb">' +
    '<span class="running"><i class="pulse"></i>taking the baseline copy</span></div>');
  post("/api/onboard/commit", payload).then(function(r){
    if(r.error){ obError(r.error); return; }
    openModal('<div class="mh"><h4>Added, and paused</h4></div><div class="mb">' +
      '<p style="margin:0 0 14px">' + h(f.client_id) + ' is configured. A baseline copy of ' +
      h((r.tabs||[]).length) + ' tabs was taken before anything else.</p>' +
      '<div class="goldbox"><b>Next:</b> press <b>Run now</b> on its card and read the output. ' +
      'It is paused, so that run will skip it &mdash; resume it once the dry run looks right.</div></div>' +
      '<div class="mf"><button class="primary" onclick="closeModal();fast()">Done</button></div>');
  }).catch(function(e){ obError(String(e)); });
}

/* poll faster while something is running */
function fast(){
  clearInterval(TIMER);
  var n = 0;
  TIMER = setInterval(function(){
    tick().then(function(){
      n++;
      if((!JOB || JOB.state !== "running") && n > 2){ clearInterval(TIMER); slow(); }
    });
  }, 1200);
  tick();
}
function slow(){ clearInterval(TIMER); TIMER = setInterval(tick, 20000); }

tick().then(function(){ if(JOB && JOB.state === "running") fast(); else slow(); });
</script>
</body></html>
